<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Why</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette from the Echoes of Wisdom logo: navy, gold, ivory. Layout: one question per screen, single column. */
:root{
  --bg:#F7F4EE; --card:#FFFFFF; --ink:#0F1E4D; --muted:#4E5675; --line:#DCD6C8;
  --accent:#C9A24B; --accent-ink:#0F1E4D; --green:#8A6A1F; --tint:#EFEADD;
  --display:'Space Grotesk', system-ui, sans-serif; --body:'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px}
header.brand{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px;color:var(--muted);font-size:14px}
header.brand img{height:64px;width:auto;display:block}
header.brand a.home{color:var(--muted);font-weight:500;text-decoration:none;padding:10px 4px}
header.brand a.home:hover{color:var(--ink)}
header.brand a:focus-visible{outline:3px solid var(--green);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0 0 12px}
h1{font-size:34px} h2{font-size:26px} h3{font-size:20px}
p{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.muted{color:var(--muted)}
.small{font-size:14px}
.progress{height:8px;background:var(--tint);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress>div{height:100%;background:var(--accent);transition:width .25s}
.section-label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:8px}
fieldset{border:0;padding:0;margin:0}
legend{font-family:var(--display);font-size:22px;line-height:1.3;margin-bottom:6px;padding:0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt input{margin-top:4px;width:20px;height:20px;accent-color:var(--green);flex:none}
.opt.on{border-color:var(--green);background:var(--tint)}
.opt.off{opacity:.5;cursor:not-allowed}
.nav{display:flex;gap:10px;margin-top:20px;justify-content:space-between}
button,.btn{font:inherit;font-weight:600;border-radius:10px;padding:13px 20px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--green);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:92px;resize:vertical}
#stmt{min-height:150px}
label.field{display:block;font-weight:600;margin:16px 0 6px}
.note{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:15px;margin:14px 0}
.theme-card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card);margin-bottom:14px}
.theme-card .rank{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-right:8px}
.theme-card h3{display:flex;align-items:center;margin-bottom:6px}
.verse{font-style:italic;color:var(--green);font-size:15px;margin:8px 0 0}
.bars{display:grid;gap:8px;margin:10px 0 18px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:12px;background:var(--tint);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--green)}
.bar.top .fill{background:var(--accent)}
.bar span.pct{text-align:right;font-variant-numeric:tabular-nums}
ul.steps{padding-left:20px;margin:8px 0}
ul.steps li{margin-bottom:6px}
.actions{display:grid;gap:10px;margin:16px 0}
.recap dt{font-weight:600;margin-top:10px}
.recap dd{margin:2px 0 0;color:var(--muted);white-space:pre-wrap}
.toast{min-height:22px;color:var(--green);font-weight:600;font-size:15px}
@media (max-width:480px){h1{font-size:28px}.bar{grid-template-columns:110px 1fr 40px;font-size:14px}}
@media print{
  body{background:#fff;color:#000}
  header.brand,.actions,.nav,.noprint{display:none!important}
  .card,.theme-card{border-color:#999;break-inside:avoid}
}
</style>
</head>

  {sec:"Where you are going", q:"Ten years from now, what would make you proudest?", o:[
    ["People I taught are now teaching others","teach"],["People I walked with found healing","care"],["A team I supported became strong","serve"],["A work I started that outlived me","lead"],["Something I made that moved many people","create"],["A solution that made life easier","build"],["Needs were met because of what I gave","give"],["People who met Jesus through me","reach"]]},
  {sec:"Where you are going", q:"Which part of church or community life draws you most?", o:[
    ["Bible study or Sunday school","teach"],["Prayer or counselling team","care"],["Hospitality, ushering or logistics","serve"],["Planning committee or leadership","lead"],["Media, choir, drama or design","create"],["Technical, sound, IT or construction","build"],["Welfare, finance or projects fund","give"],["Evangelism or outreach","reach"]]}
];

var PEOPLE = [
  ["Children","children"],["Teenagers","teenagers"],["Students","students"],["Young adults","young adults"],["Families and couples","families"],
  ["The sick and the elderly","the sick and the elderly"],["The poor and those in need","people in need"],["People who have not heard the gospel","people who have not yet heard the gospel"],
  ["Believers who need to grow","believers who want to grow"],["Leaders and ministers","leaders and ministers"],["Workers and business owners","workers and business owners"]
];

var WORDS = [
  ["heart","What breaks your heart? What problem do you keep thinking about?"],
  ["asked","What do people often ask you for help with?"],
  ["free","What would you do even if no one paid or thanked you?"],
  ["season","One hard season that taught you something (share only what you want)."]
];

var MAX_PICK = 2;
var TOTAL_Q = QUESTIONS.length;
var STEP_PEOPLE = TOTAL_Q + 1, STEP_WORDS = TOTAL_Q + 2, STEP_RESULT = TOTAL_Q + 3;

/* ===== Scoring (pure) ===== */
function availability(){
  var a = {}; Object.keys(THEMES).forEach(function(k){a[k]=0;});
  QUESTIONS.forEach(function(q){ var seen={}; q.o.forEach(function(o){ if(!seen[o[1]]){seen[o[1]]=1;a[o[1]]++;} }); });
  return a;
}
function score(answers){
  var avail = availability(), raw = {}, out = [];
  Object.keys(THEMES).forEach(function(k){raw[k]=0;});
  Object.keys(answers).forEach(function(qi){
    (answers[qi]||[]).forEach(function(oi){ var o = QUESTIONS[qi].o[oi]; if(o) raw[o[1]]++; });
  });
  Object.keys(THEMES).forEach(function(k){
    out.push({key:k, raw:raw[k], pct:Math.round(100*raw[k]/avail[k])});
  });
  out.sort(function(a,b){ return b.pct-a.pct || b.raw-a.raw; });
  return out;
}
function joinList(items){
  if(!items.length) return "people";
  if(items.length===1) return items[0];
  return items.slice(0,-1).join(", ")+" and "+items[items.length-1];
}
function statement(ranked, peopleKeys){
  var t1 = THEMES[ranked[0].key], t2 = THEMES[ranked[1].key];
  var p = joinList(peopleKeys);
  return "I exist to "+t1.act(p)+", especially through "+t2.how+", so that "+t1.change+", to the glory of God.";
}

/* ===== UI ===== */
var state = {step:0, answers:{}, custom:{}, people:[], peopleOther:"", words:{}, name:"", statement:""};
var app = null;

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function $(sel){ return app.querySelector(sel); }

function progress(){
  var n = Math.min(state.step, STEP_WORDS), total = STEP_WORDS;
  return '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+n+'"><div style="width:'+Math.round(100*n/total)+'%"></div></div>'+
         '<p class="small muted">Step '+n+' of '+total+'</p>';
}
function go(step){ state.step = step; render(); window.scrollTo(0,0); }

function renderIntro(){
  app.innerHTML =
    '<div class="card">'+
    '<h1>Find your why</h1>'+
    '<p>Answer 20 short questions and a few of your own. You will get your strongest purpose themes, a draft purpose statement, matching Bible verses and a next step. It takes about ten minutes.</p>'+
    '<div class="note"><strong>Private by default.</strong> Your answers stay on your device. Nothing is saved or sent anywhere. At the end you can choose to share your results with '+esc(MENTOR_NAME)+' if you want guidance.</div>'+
    '<p class="small muted">This is a starting point, not a verdict. God shows His purpose through His Word, prayer, wise counsel and faithful steps. Take your results to your mentor and test them.</p>'+
    '<label class="field" for="name">Your first name (optional)</label>'+
    '<input type="text" id="name" autocomplete="given-name" value="'+esc(state.name)+'">'+
    '<div class="nav"><span></span><button class="primary" id="start">Start</button></div>'+
    '</div>';
  $('#start').onclick = function(){ state.name = $('#name').value.trim(); go(1); };
}

function renderQuestion(){
  var qi = state.step-1, q = QUESTIONS[qi], sel = state.answers[qi] || [];
  var html = progress()+'<div class="card"><div class="section-label">'+esc(q.sec)+'</div>'+
    '<fieldset><legend>'+esc(q.q)+'</legend><p class="small muted">Choose up to two.</p><div class="opts">';
  q.o.forEach(function(o,i){
    var on = sel.indexOf(i)>-1, off = !on && sel.length>=MAX_PICK;
    html += '<label class="opt'+(on?' on':'')+(off?' off':'')+'"><input type="checkbox" value="'+i+'"'+(on?' checked':'')+(off?' disabled':'')+'><span>'+esc(o[0])+'</span></label>';
  });
  var cust = state.custom[qi] || "";
  html += '</div></fieldset>'+
    '<label class="field" for="other">Not in the list? Write your own answer (optional)</label>'+
    '<input type="text" id="other" maxlength="200" placeholder="Type here" value="'+esc(cust)+'">'+
    '<p class="small muted">Your own answer is not scored, but it appears in your results and goes to your mentor if you share.</p>'+
    '<div class="nav"><button id="back">Back</button><button class="primary" id="next"'+((sel.length||cust)?'':' disabled')+'>Next</button></div></div>';
  app.innerHTML = html;
  $('#other').oninput = function(){
    state.custom[qi] = this.value.trim();
    $('#next').disabled = !((state.answers[qi]||[]).length || state.custom[qi]);
  };
  Array.prototype.forEach.call(app.querySelectorAll('input[type=checkbox]'),function(cb){
    cb.onchange = function(){
      var cur = state.answers[qi] || [], v = parseInt(cb.value,10);
      cur = cb.checked ? cur.concat([v]) : cur.filter(function(x){return x!==v;});
      state.answers[qi] = cur; renderQuestionKeepFocus(cb.value);
    };
  });
  $('#back').onclick = function(){ go(state.step-1); };
  $('#next').onclick = function(){ go(state.step+1); };
}
function renderQuestionKeepFocus(val){
  var y = window.scrollY; renderQuestion();
  var el = app.querySelector('input[value="'+val+'"]'); if(el) el.focus();
  window.scrollTo(0,y);
}

function renderPeople(){
  var html = progress()+'<div class="card"><div class="section-label">Who you care about</div>'+
    '<fieldset><legend>Which people do you feel most drawn to help?</legend><p class="small muted">Choose up to three.</p><div class="opts">';
  PEOPLE.forEach(function(p,i){
    var on = state.people.indexOf(i)>-1, off = !on && state.people.length>=3;
    html += '<label class="opt'+(on?' on':'')+(off?' off':'')+'"><input type="checkbox" value="'+i+'"'+(on?' checked':'')+(off?' disabled':'')+'><span>'+esc(p[0])+'</span></label>';
  });
  html += '</div></fieldset>'+
    '<label class="field" for="other">Someone else? Write it here (optional)</label>'+
    '<input type="text" id="other" maxlength="100" placeholder="For example: single mothers, prisoners, farmers" value="'+esc(state.peopleOther)+'">'+
    '<div class="nav"><button id="back">Back</button><button class="primary" id="next"'+((state.people.length||state.peopleOther)?'':' disabled')+'>Next</button></div></div>';
  app.innerHTML = html;
  $('#other').oninput = function(){
    state.peopleOther = this.value.trim();
    $('#next').disabled = !(state.people.length || state.peopleOther);
  };
  Array.prototype.forEach.call(app.querySelectorAll('input[type=checkbox]'),function(cb){
    cb.onchange = function(){
      var v = parseInt(cb.value,10);
      state.people = cb.checked ? state.people.concat([v]) : state.people.filter(function(x){return x!==v;});
      var y = window.scrollY; renderPeople();
      var el = app.querySelector('input[value="'+cb.value+'"]'); if(el) el.focus(); window.scrollTo(0,y);
    };
  });
  $('#back').onclick = function(){ go(state.step-1); };
  $('#next').onclick = function(){ go(state.step+1); };
}

function renderWords(){
  var html = progress()+'<div class="card"><div class="section-label">In your own words</div><h2>Four short reflections</h2>'+
    '<p class="small muted">Optional, but they make your results more personal. A sentence or two is enough.</p>';
  WORDS.forEach(function(w){
    html += '<label class="field" for="w_'+w[0]+'">'+esc(w[1])+'</label><textarea id="w_'+w[0]+'">'+esc(state.words[w[0]]||'')+'</textarea>';
  });
  html += '<div class="nav"><button id="back">Back</button><button class="primary" id="next">See my results</button></div></div>';
  app.innerHTML = html;
  function save(){ WORDS.forEach(function(w){ state.words[w[0]] = $('#w_'+w[0]).value.trim(); }); }
  $('#back').onclick = function(){ save(); go(state.step-1); };
  $('#next').onclick = function(){ save(); state.statement = ""; go(state.step+1); };
}

function peopleKeys(){
  var k = state.people.map(function(i){ return PEOPLE[i][1]; });
  if(state.peopleOther) k.push(state.peopleOther);
  return k;
}
function customAnswers(){
  var out = [];
  Object.keys(state.custom).forEach(function(qi){ if(state.custom[qi]) out.push({q:QUESTIONS[qi].q, a:state.custom[qi]}); });
  return out;
}

function shareText(ranked){
  var L = [];
  L.push("My Find Your Why results"+(state.name?" ("+state.name+")":""));
  L.push("");
  L.push("Top themes:");
  ranked.slice(0,3).forEach(function(r,i){ L.push((i+1)+". "+THEMES[r.key].name+" ("+r.pct+"%)"); });
  var ppl = peopleKeys(); if(ppl.length) L.push("People I care about: "+joinList(ppl));
  L.push(""); L.push("My draft purpose statement:"); L.push(state.statement);
  var any = WORDS.some(function(w){return state.words[w[0]];});
  if(any){ L.push(""); L.push("In my own words:"); WORDS.forEach(function(w){ if(state.words[w[0]]) L.push("- "+w[1]+" "+state.words[w[0]]); }); }
  var ca = customAnswers();
  if(ca.length){ L.push(""); L.push("Answers I wrote myself:"); ca.forEach(function(c){ L.push("- "+c.q+" "+c.a); }); }
  L.push(""); L.push("I would like your guidance on this.");
  return L.join("\n");
}

function renderResult(){
  var ranked = score(state.answers), top = ranked.slice(0,3), ppl = peopleKeys();
  if(!state.statement) state.statement = statement(ranked, ppl);
  var html = '<div class="card"><div class="section-label">Your results</div>'+
    '<h1>'+(state.name?esc(state.name)+', here is what your answers point to':'Here is what your answers point to')+'</h1>'+
    '<p class="muted">These are themes to explore, not a final answer. Pray over them and test them with your mentor.</p></div><div style="height:14px"></div>';
  top.forEach(function(r,i){
    var t = THEMES[r.key];
    html += '<div class="theme-card"><h3><span class="rank">'+(i+1)+'</span>'+esc(t.name)+'</h3><p>'+esc(t.desc)+'</p><p class="verse">'+esc(t.verse)+'</p></div>';
  });
  html += '<div class="card"><h3>All eight themes</h3><div class="bars">';
  ranked.forEach(function(r,i){
    html += '<div class="bar'+(i<3?' top':'')+'"><span>'+esc(THEMES[r.key].name)+'</span><div class="track"><div class="fill" style="width:'+r.pct+'%"></div></div><span class="pct">'+r.pct+'%</span></div>';
  });
  html += '</div><p class="small muted">The percentage shows how often you chose that theme out of the times it was offered.</p></div><div style="height:14px"></div>';
  html += '<div class="card"><h3>Your draft purpose statement</h3><p class="small muted">Edit it until it sounds like you. Your purpose is bigger than a job title, and it will sharpen over time.</p>'+
    '<label class="field" for="stmt">My draft</label><textarea id="stmt">'+esc(state.statement)+'</textarea></div><div style="height:14px"></div>';
  var t1 = THEMES[top[0].key];
  html += '<div class="card"><h3>Your next steps</h3><ul class="steps">'+t1.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+
    '<li>Test your draft with the seven lenses: Scripture, prayer, gifts, burden, counsel, open doors and faithfulness.</li></ul>'+
    '<p class="verse">“Without counsel purposes are disappointed: but in the multitude of counsellors they are established.” (Proverbs 15:22)</p></div><div style="height:14px"></div>';
  var any = WORDS.some(function(w){return state.words[w[0]];}), ca = customAnswers();
  if(any || ca.length){
    html += '<div class="card"><h3>In your own words</h3><dl class="recap">';
    WORDS.forEach(function(w){ if(state.words[w[0]]) html += '<dt>'+esc(w[1])+'</dt><dd>'+esc(state.words[w[0]])+'</dd>'; });
    ca.forEach(function(c){ html += '<dt>'+esc(c.q)+'</dt><dd>'+esc(c.a)+'</dd>'; });
    html += '</dl>'+(ca.length?'<p class="small muted">Answers you wrote yourself are not part of the scores. Look for them when you talk with your mentor.</p>':'')+'</div><div style="height:14px"></div>';
  }
  html += '<div class="card noprint"><h3>Want guidance?</h3><p class="muted">Sharing is your choice. Nothing is sent until you press a button, and you can read the message first.</p>'+
    '<div class="actions">'+
    '<button class="primary" id="wa">Send to '+esc(MENTOR_NAME)+' on WhatsApp</button>'+
    '<button id="mail">Send to '+esc(MENTOR_NAME)+' by email</button>'+
    '<button id="copy">Copy my results</button>'+
    '<button id="print">Print or save as PDF</button>'+
    '<button id="again">Start again</button></div><div class="toast" id="toast" role="status"></div></div>';
  app.innerHTML = html;

  $('#stmt').oninput = function(){ state.statement = this.value; };
  function toast(m){ $('#toast').textContent = m; }
  $('#wa').onclick = function(){
    var url = "https://wa.me/"+(MENTOR_WHATSAPP||"")+"?text="+encodeURIComponent(shareText(ranked));
    window.open(url, "_blank", "noopener");
  };
  $('#mail').onclick = function(){
    var url = "mailto:"+(MENTOR_EMAIL||"")+"?subject="+encodeURIComponent("My Find Your Why results")+"&body="+encodeURIComponent(shareText(ranked));
    window.location.href = url;
  };
  $('#copy').onclick = function(){
    var txt = shareText(ranked);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("Copied. You can paste it anywhere."); },function(){ toast("Could not copy. Select the text and copy it yourself."); });
    } else { toast("Copy is not available in this browser."); }
  };
  $('#print').onclick = function(){ window.print(); };
  $('#again').onclick = function(){ state = {step:0, answers:{}, custom:{}, people:[], peopleOther:"", words:{}, name:"", statement:""}; go(0); };
}

function render(){
  if(state.step===0) renderIntro();
  else if(state.step<=TOTAL_Q) renderQuestion();
  else if(state.step===STEP_PEOPLE) renderPeople();
  else if(state.step===STEP_WORDS) renderWords();
  else renderResult();
}

function init(){ app = document.getElementById('app'); render(); }
if (typeof document !== 'undefined' && document.getElementById) { init(); }
if (typeof module !== 'undefined') { module.exports = {THEMES:THEMES,QUESTIONS:QUESTIONS,score:score,statement:statement,availability:availability}; }
</script>
</body>
</html>
